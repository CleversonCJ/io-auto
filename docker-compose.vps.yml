name: ioauto-vps

x-api-environment:
  IOAUTO_LANDING_CHECKOUT_URL: ${IOAUTO_LANDING_CHECKOUT_URL:-https://ioauto.com.br/api/checkout/link}
  IOAUTO_LANDING_CHECKOUT_BEARER: ${IOAUTO_LANDING_CHECKOUT_BEARER:-}

services:
  postgres:
    image: postgres:16
    container_name: ioauto_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ioauto_network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ioauto-api
    restart: unless-stopped
    depends_on:
      - postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      IOAUTO_LANDING_CHECKOUT_URL: ${IOAUTO_LANDING_CHECKOUT_URL:-https://ioauto.com.br/api/checkout/link}
      IOAUTO_LANDING_CHECKOUT_BEARER: ${IOAUTO_LANDING_CHECKOUT_BEARER:-}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      API_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASS: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DATABASE: ${REDIS_DATABASE:-1}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      APP_DB_ENCRYPTION_KEY: ${APP_DB_ENCRYPTION_KEY}
      JWT_SECRET: ${JWT_SECRET}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}
      MELI_CLIENT_ID: ${MELI_CLIENT_ID:-}
      MELI_CLIENT_SECRET: ${MELI_CLIENT_SECRET:-}
      MELI_REDIRECT_URI: ${MELI_REDIRECT_URI:-}
      MELI_API_BASE_URL: ${MELI_API_BASE_URL:-https://api.mercadolibre.com}
      MELI_AUTH_BASE_URL: ${MELI_AUTH_BASE_URL:-https://auth.mercadolivre.com.br}
      MELI_SITE_ID: ${MELI_SITE_ID:-MLB}
      MELI_CURRENCY_ID: ${MELI_CURRENCY_ID:-BRL}
      MELI_WEBHOOK_URL: ${MELI_WEBHOOK_URL:-}
      MELI_WEBHOOK_SECRET: ${MELI_WEBHOOK_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      IOAUTO_PLAN_KEY: ${IOAUTO_PLAN_KEY:-ioauto-growth}
      IOAUTO_PLAN_NAME: ${IOAUTO_PLAN_NAME:-IOAuto Growth}
      JAVA_OPTS: ${JAVA_OPTS:-}
      OLX_CLIENT_ID: ${OLX_CLIENT_ID}
      OLX_CLIENT_SECRET: ${OLX_CLIENT_SECRET}
      OLX_REDIRECT_URI: ${OLX_REDIRECT_URI}
      OLX_AUTH_BASE_URL: ${OLX_AUTH_BASE_URL}
      OLX_API_BASE_URL: ${OLX_API_BASE_URL}
      OLX_WEBHOOK_URL: ${OLX_WEBHOOK_URL}
      OLX_WEBHOOK_TOKEN: ${OLX_WEBHOOK_TOKEN}
      ONBOARDING_INTERNAL_API_TOKEN: ${ONBOARDING_INTERNAL_API_TOKEN}
      ONBOARDING_ALLOWED_IPS: ${ONBOARDING_ALLOWED_IPS:-}
      ONBOARDING_PAYMENT_EVENT_ALLOW_ANONYMOUS: ${ONBOARDING_PAYMENT_EVENT_ALLOW_ANONYMOUS:-false}
      ASAAS_BASE_URL: ${ASAAS_BASE_URL:-https://api.asaas.com}
      ASAAS_ACCESS_TOKEN: ${ASAAS_ACCESS_TOKEN}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN}
      LOGIN_URL: ${LOGIN_URL:-https://app.ioauto.com.br/login}
      SET_PASSWORD_URL: ${SET_PASSWORD_URL:-https://app.ioauto.com.br/definir-senha}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_SMTP_STARTTLS_ENABLE:-true}
      MAIL_SMTP_STARTTLS_REQUIRED: ${MAIL_SMTP_STARTTLS_REQUIRED:-true}
      MAIL_SMTP_SSL_ENABLE: ${MAIL_SMTP_SSL_ENABLE:-false}
      MAIL_CONNECTION_TIMEOUT_MS: ${MAIL_CONNECTION_TIMEOUT_MS:-10000}
      MAIL_TIMEOUT_MS: ${MAIL_TIMEOUT_MS:-10000}
      MAIL_WRITE_TIMEOUT_MS: ${MAIL_WRITE_TIMEOUT_MS:-10000}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    networks:
      - ioauto_network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    container_name: ioauto_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_INTERNAL_BASE: ${API_INTERNAL_BASE:-http://ioauto-api:8080}
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      JWT_SECRET_FOR_MIDDLEWARE: ${JWT_SECRET_FOR_MIDDLEWARE}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      ONBOARDING_INTERNAL_API_TOKEN: ${ONBOARDING_INTERNAL_API_TOKEN}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    networks:
      - ioauto_network

volumes:
  postgres_data:

networks:
  ioauto_network:
    external: true
    name: ioauto_network
